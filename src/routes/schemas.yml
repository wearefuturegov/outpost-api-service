components:
  schemas:
    Service:
      required:
        - name
        - updated_at
        - created_at
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 10
        updated_at:
          type: string
          format: date-time
          example: "2024-09-13T11:54:32.661Z"
        name:
          type: string
          example: "Brekke-Conroy"
        description:
          type: string
          example: "Labore velit totam. Dolore ut perspiciatis. Officiis architecto quo."
        url:
          type: string
          nullable: true
          example: null
        visible_from:
          type: string
          format: date
          example: "2024-09-13"
        visible_to:
          type: string
          format: date
          example: "2024-09-13"
        min_age:
          type: integer
          nullable: true
          example: null
        max_age:
          type: integer
          nullable: true
          example: null
        age_band_under_2:
          type: integer
          nullable: true
          example: null
        age_band_2:
          type: integer
          nullable: true
          example: null
        age_band_3_4:
          type: integer
          nullable: true
          example: null
        age_band_5_7:
          type: integer
          nullable: true
          example: null
        age_band_8_plus:
          type: integer
          nullable: true
          example: null
        age_band_all:
          type: integer
          nullable: true
          example: null
        needs_referral:
          type: boolean
          nullable: true
          example: null
        free:
          type: boolean
          nullable: true
          example: null
        created_at:
          type: string
          format: date-time
          example: "2024-09-13T11:43:05.466Z"
        status:
          type: string
          description: service status
          example: "active"
          enum:
            - pending
            - marked for deletion
            - archived
            - invisible
            - scheduled"
            - expired
            - temporarily closed
            - active
        directories:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
                example: "Directory 1"
              label:
                type: string
                example: "directory-1"
        locations:
          type: array
          items:
            $ref: "#/components/schemas/Location"
        service_at_locations:
          type: array
          items:
            $ref: "#/components/schemas/ServiceAtLocation"
        regular_schedules:
          type: array
          items:
            allOf:
              - $ref: "#/components/schemas/RegularSchedule"
              - type: object
                properties:
                  service_at_location:
                    $ref: "#/components/schemas/ServiceAtLocation"
                description: "RegularSchedule schema with service_at_location property when used with regular_schedules"
        contacts:
          type: array
          items:
            $ref: "#/components/schemas/Contact"
        # meta:
        organisation:
          type: array
          items:
            $ref: "#/components/schemas/Organisation"
        taxonomies:
          type: array
          items:
            $ref: "#/components/schemas/Taxonomy"
        cost_options:
          type: array
          items:
            $ref: "#/components/schemas/CostOption"
        links:
          type: array
          items:
            $ref: "#/components/schemas/Link"
        send_needs:
          type: array
          items:
            $ref: "#/components/schemas/SendNeed"
        suitabilities:
          type: array
          items:
            $ref: "#/components/schemas/Suitability"
        local_offer:
          $ref: "#/components/schemas/LocalOffer"
        score:
          type: number
          format: float
          example: "3.125"
        distance_away:
          type: number
          format: float
          example: "0.03658351568252586"
    ServiceAtLocation:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        service_id:
          type: integer
          format: int64
          example: 1
        location_id:
          type: integer
          format: int64
          example: 1
        location:
          $ref: "#/components/schemas/Location"
        regular_schedule:
          type: array
          items:
            $ref: "#/components/schemas/RegularSchedule"
    RegularSchedule:
      type: object
      description: The basic structure of a regular schedule
      required:
        - id
        - weekday
        - opens_at
        - closes_at
      properties:
        id:
          type: integer
          format: int64
          example: 1
        weekday:
          type: string
          example: "Monday"
          enum:
            - Monday
            - Tuesday
            - Wednesday
            - Thursday
            - Friday
            - Saturday
            - Sunday
        opens_at:
          type: string
          format: time
          example: "16:00"
        closes_at:
          type: string
          format: time
          example: "18:00"
        dtstart:
          type: string
          format: date-time
          example: "2024-09-26T00:00:00.000Z"
        freq:
          type: string
          example: "weekly"
          nullable: true
          enum:
            - week
            - month
        interval:
          type: integer
          example: 1
          nullable: true
        byday:
          type: string
          nullable: true
        bymonthday:
          type: string
          nullable: true
        until:
          type: string
          format: date-time
          example: "2024-09-13T11:54:32.661Z"
          nullable: true
        count:
          type: integer
          example: 1
          nullable: true
        description:
          type: string
          example: "Monday from 04:00pm to 06:00pm"
          nullable: true
    Location:
      type: object
      required:
        - id
        - postal_code
      properties:
        id:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          example: "Integer posuere erat a ante venenatis dapibus posuere velit aliquet."
        address_1:
          type: string
          example: "10 Downing Street"
        city:
          type: string
          example: "London"
        state_province:
          type: string
          example: "England"
        postal_code:
          type: string
          example: "SW1A 1AA"
        country:
          type: string
          example: "United Kingdom"
        geometry:
          type: object
          properties:
            type:
              type: string
              example: "Point"
            coordinates:
              type: array
              items:
                type: number
              example: [-1.029582, 51.778205]
        mask_exact_address:
          type: boolean
          example: false
        accessibilities:
          type: array
          items:
            $ref: "#/components/schemas/Accessibility"
    Organisation:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          example: "Organisation 1"
        description:
          type: string
          example: "Organisation 1"
        email:
          type: string
          format: email
          example: "Organisation 1"
        url:
          type: string
          format: uri
          example: "http://example.com"
    Taxonomy:
      type: object
      required:
        - id
        - name
        - slug
        - parent_id
      properties:
        id:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          example: "Taxonomy 1"
        slug:
          type: string
          example: "taxonomy-1"
        parent_id:
          type: integer
          format: int64
          example: 1
    CostOption:
      type: object
      required:
        - id
        - amount
      properties:
        id:
          type: integer
          format: int64
          example: 1
        option:
          type: string
          example: "Option 1"
        amount:
          type: number
          format: float
          example: "3.125"
        cost_type:
          type: string
          example: "Cost type 1"
          enum:
            - per day
            - per half day
            - per hour
            - per hour - after school
            - per hour - before school
            - per hour - before or after school
            - per hour - full time
            - per hour - part time
            - per hour - weekend
            - per meal
            - per month
            - per session
            - per term
            - per week
            - lower rate for second sibling
    Link:
      type: object
      required:
        - label
        - url
      properties:
        label:
          type: string
          format: uri
          example: "Example url"
        url:
          type: string
          format: uri
          example: "https://example.com"
    LocalOffer:
      type: object
      properties:
        description:
          type: string
          description: Description of support provided
          example: "Labore velit totam. Dolore ut perspiciatis. Officiis architecto quo."
        link:
          type: string
          description: Link to most recent SEND report
          example: "Labore velit totam. Dolore ut perspiciatis. Officiis architecto quo."
        survey_answers:
          type: object
          description: Survey answers in the Details about your support section
          example: "Labore velit totam. Dolore ut perspiciatis. Officiis architecto quo."
          # question: "What outcomes does your setting, service or activity aim to achieve for children and young people with SEND and their families?",
          # question: "What recent SEND-specific training has been completed by your staff and/or volunteers?",
          # question: "How do you involve parents and how can I get involved?",
          # question: "How will you share information with me about my child’s progress? What is additional for children with SEND?",
          # question: "How accessible is the environment (indoors and outdoors)?",
          # question: "How can children and young people with SEND and their families start to use your service or activity?",
          # question: "What future plans do you have for developing your SEND provision?",
          properties:
            question:
              type: string
              example: "What is the name of your service?"
            answer:
              type: string
              example: "Morbi leo risus, porta ac consectetur ac, vestibulum at eros."
    Suitability:
      # "Autism",
      # "Learning difficulties",
      # "Mental health/acquired brain injury",
      # "Visual and / or hearing impediment",
      # "Physical disabilities",
      # "Older people",
      # "Dementia"
      required:
        - id
        - name
        - slug
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          example: "Visual and/or hearing impediment"
        slug:
          type: string
          example: "visual-and-or-hearing-impediment"
    SendNeed:
      # "Autism",
      # "Hearing impairment",
      # "Visual impairment",
      # "Mobility",
      # "Cognitive"
      required:
        - id
        - name
        - slug
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          example: "Autism"
        slug:
          type: string
          example: "autism"
    Accessibility:
      type: object
      required:
        - name
        - slug
      properties:
        # Accessible toilet facilities
        # Hearing loop
        # Car parking
        # Changing facilities
        # British sign language (bsl)
        # Disabled car parking space
        # Hoist
        # Baby changing facilities
        # Parking nearby
        # Bus stop nearby
        # Building has lift
        # Wheelchair accessible entrance
        # Partial wheelchair access
        name:
          type: string
          example: "Accessible toilet facilities"
        slug:
          type: string
          example: "accessible-toilet-facilities"
    Contact:
      required:
        - name
        - email
        - phone
      type: object
      properties:
        name:
          type: string
          example: "John Doe"
        title:
          type: string
          example: "John Doe"
        visible:
          type: string
          example: "John Doe"
        email:
          type: string
          example: "John Doe"
        phone:
          type: string
          example: "John Doe"
    Meta:
      type: object
      required:
        - value
        - key
      properties:
        key:
          type: string
          example: "Custom field question"
        value:
          type: string
          example: "Custom field answer"
